name: Build APK
on:
  push:
    paths: ['android/**', '.github/workflows/build.yml']
  workflow_dispatch:

concurrency:
  group: retroiso-main-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer la signature Android permanente
        env:
          RETROISO_SIGNING_BUNDLE: ${{ secrets.RETROISO_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          if [ -z "$RETROISO_SIGNING_BUNDLE" ]; then
            echo "::error title=Signature permanente manquante::Ajoute le secret RETROISO_SIGNING_BUNDLE dans Settings > Secrets and variables > Actions. Aucun APK instable ne sera publié."
            exit 1
          fi
          SIGN_DIR="$RUNNER_TEMP/retroiso-signing"
          mkdir -p "$SIGN_DIR"
          printf '%s' "$RETROISO_SIGNING_BUNDLE" | base64 --decode > "$RUNNER_TEMP/retroiso-signing.tgz"
          tar -xzf "$RUNNER_TEMP/retroiso-signing.tgz" -C "$SIGN_DIR"
          test -s "$SIGN_DIR/retroiso.jks"
          test -s "$SIGN_DIR/password.txt"
          chmod 600 "$SIGN_DIR/retroiso.jks" "$SIGN_DIR/password.txt"
          keytool -list -keystore "$SIGN_DIR/retroiso.jks" -storepass:file "$SIGN_DIR/password.txt" -alias retroiso >/dev/null
          echo "RETROISO_KEYSTORE_PATH=$SIGN_DIR/retroiso.jks" >> "$GITHUB_ENV"
          echo "RETROISO_SIGNING_PASSWORD_FILE=$SIGN_DIR/password.txt" >> "$GITHUB_ENV"
          echo "Signature stable validée, certificat conservé en secret GitHub."

      - name: Verify patch detection
        run: |
          mkdir -p /tmp/retroiso-patch-tests
          javac -d /tmp/retroiso-patch-tests app/src/main/java/com/elmagnifico/retroiso/runtime/winlator/GangstersPatch107.java tests/GangstersPatch107Test.java
          java -cp /tmp/retroiso-patch-tests com.elmagnifico.retroiso.runtime.winlator.GangstersPatch107Test

      - name: Install ELF patch tool
        run: |
          if ! command -v patchelf >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y patchelf
          fi

      - name: Prepare embedded Winlator runtime
        run: |
          chmod +x bootstrap-winlator-runtime.sh
          ./bootstrap-winlator-runtime.sh

      - name: Install Android native toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "ndk;24.0.8215888" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Retro ISO with embedded runtime
        run: gradle assembleDebug --no-daemon

      - name: Vérifier la signature de l'APK générée
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APK_SIGNER"
          "$APK_SIGNER" verify --print-certs "$APK" | grep -E 'Signer #1 certificate SHA-256 digest'
          echo "APK vérifiée avec sa signature persistante."

      - name: Publier l'APK de test sans supprimer les versions précédentes
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          TAG="apk-${GITHUB_RUN_ID}"
          cat > /tmp/retroiso-release-notes.md <<'NOTES'
          APK Android avec Winlator/Wine/Box64 intégré.
          
          - PREMIÈRE INSTALLATION : si une APK précédente est signée avec une clé différente, il faut désinstaller l'ancienne version. Toutes ses données locales sont alors supprimées.
          - Ensuite, les nouvelles APK conserveront la même signature privée via GitHub Actions Secrets (RETROISO_SIGNING_BUNDLE).
          - L'APK est publiée seulement après vérification de sa signature.
          
          - Gangsters 2 : contrôles tactiles flottants dans les bandes latérales : flèches, clic droit, Entrée, Échap, clic gauche, double-clic.
          - Nouveau bouton Couleurs sur la gauche : correction rouge/bleu de l'image DirectDraw via le shader, activée par défaut et réversible sans quitter le jeu.
          - Nouvelle session de jeu avec notification Android (service de premier plan « specialUse »), pour réduire les fermetures lors d'un changement d'application ; ne garantit pas la survie en cas de manque de mémoire.
          - Traces Android sur pause/reprise et pression mémoire ajoutées au diagnostic pour mieux identifier les retours au menu.
          - Nouveau bouton MAJ (Shift) sur la droite de Gangsters 2 : appui court pour verrouiller/déverrouiller ; appui prolongé pour maintenir uniquement le temps du contact.
          - MAJ ✓ apparaît en vert quand Shift est verrouillée ; MAJ ↓ lors d'un maintien temporaire.
          - Libération de Shift à la fermeture du jeu ; aucune modification des fichiers ou des sauvegardes.
          - Flèches gauche : véritables touches de défilement de carte du pavé numérique 8/4/6/2 (conformément au manuel Gangsters 2).
          - Mode DIRECT : un toucher = clic gauche, appui long = clic droit maintenu, glissement = clic droit maintenu pour faire défiler la carte.
          - Glisser: sélection : bascule le glissement en clic gauche maintenu pour encadrer plusieurs personnages.
          - Sortie des limites de l'écran 4:3 pendant un glissement : aucun déplacement forcé du curseur vers le bord (anti-dérive).
          - Mode DIRECT par défaut : toucher à la position absolue dans l'image 4:3.
          - Bouton DIRECT / SOURIS pour revenir au touchpad Winlator ; choix sauvegardé pour les lancements suivants.
          - Commandes activées uniquement en jouant à Gangsters 2, pas pendant l'installation ou dans les autres jeux.
          - Gangsters 2 : bureau Wine réglé à 800x600 afin que le jeu 4:3 remplisse la hauteur de l'écran, sans étirement.
          - Le réglage s'applique aussi au conteneur existant, sans réinstaller le jeu ni toucher aux autres jeux.
          - Gangsters 2 : rendu DirectDraw basculé sur VirGL + WineD3D, pour éviter le chemin Gladio qui échoue à charger libEGL.so.1 sur Pixel 9a.
          - Le choix est appliqué aussi aux containers existants : aucun dossier de jeu ou sauvegarde supprimé par ce correctif.
          - Dans le diagnostic du lancement, RETROISO_GRAPHICS doit afficher [vortek, virgl].
          - Le test sera validé uniquement si le jeu peut effectivement commencer une partie sur le téléphone.
          - Correction de la clé réellement lue par Hothouse : Software\Gangsters2, sans g final.
          - Chemin préparé dans les deux vues du registre, pour le lancement automatique et manuel du patch.
          - Validation de la mise à jour par les SHA-256 des quatre fichiers du pack fourni ; les anciens marqueurs seuls ne suffisent plus.
          - Le bouton Jouer démarre maintenant directement Gangsters 2 si installé : l'updater 1.0.7 en échec n'est plus relancé automatiquement.
          - Le patch reste accessible manuellement via Choisir un programme. Pas de réinstallation du jeu nécessaire tant que l'APK peut être mise à jour sans désinstallation.
          
          - Lancement des fichiers du CD explicitement sur X:, comme dans le sélecteur.
          - Bouton Diagnostic : rapport local du dernier lancement, copiable après une erreur.
          - Cause de Failed, code 8 encore à confirmer sur le téléphone.
          - Choisir un programme : liste des EXE du CD (X:), de l'installation (C:) et des patchs (D:).
          - Actualisation de la liste et mémorisation du dernier programme choisi.
          - Gangsters 2 : installation automatique toujours via Autorun.exe.
          - Diagnostic Wine ciblé enregistré localement, sans envoi automatique.
          - Import ISO via le sélecteur Android, notamment Google Drive.
          
          Compilation vérifiée par GitHub Actions. Installation et performances de Gangsters 2 sur Pixel 9a à tester : ce téléchargement n'est pas une validation du jeu.
          NOTES
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk --target "$GITHUB_SHA" --title "Retro ISO 0.6.0 — signature Android permanente" --notes-file /tmp/retroiso-release-notes.md --prerelease

