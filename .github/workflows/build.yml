name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: android}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.7}
      - run: gradle assembleDebug --no-daemon
      - name: Publier l'APK dans les Releases
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk --title "Retro ISO (dernier build)" --notes "Build automatique"
