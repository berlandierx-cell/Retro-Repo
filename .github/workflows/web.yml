name: Build and publish Retro Iso Web
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

concurrency:
  group: retroiso-web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: web/.cache/wine
          key: retroiso-wine-v14-build87
      - name: Build pinned emulator and BIOS
        run: npm run build
      - name: Verify engines, persistence, ISO parsing and Drive transfers
        run: npm test
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify real Windows file write and cold restart in Chromium
        run: node scripts/browser-smoke.mjs
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: web/browser-results
      - uses: actions/upload-artifact@v4
        with:
          name: retroiso-web
          path: web/dist
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Publish web app
        id: deployment
        uses: actions/deploy-pages@v4
